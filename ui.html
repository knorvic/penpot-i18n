<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knorvic i18n</title>
<style>
  :root { --bg: #ffffff; --fg: #1b2228; --muted: #6b7781; --line: #e3e7ea; --accent: #00756a; --accent-fg: #ffffff; --chip: #f1f4f6; }
  :root[data-theme="dark"] { --bg: #18191d; --fg: #e8ecef; --muted: #8f9aa3; --line: #2e3238; --accent: #31c6b4; --accent-fg: #06221f; --chip: #24272c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .file { color: var(--muted); margin-bottom: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 10px; padding: 12px 8px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: progress; }
  .stats { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .row { display: flex; justify-content: space-between; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .status { min-height: 18px; margin-bottom: 8px; color: var(--muted); }
  .status.error { color: #d1453b; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
  <h1>Language</h1>
  <div class="file" id="file">Loading…</div>
  <div class="langs" id="langs"></div>
  <div class="status" id="status"></div>
  <div class="stats" id="stats" hidden>
    <div class="row"><span>Translated texts</span><span id="translated">0</span></div>
    <div class="row"><span>Changed since translating</span><span id="outdated">0</span></div>
    <div class="row"><span>Without translation</span><span id="missing">0</span></div>
    <div><button class="link" id="refresh" type="button">Recount</button></div>
  </div>
  <p class="note">English is the source. Switching changes the file for everyone viewing it, so switch back to English when you are done.</p>
<script>
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get('theme') || 'light';
  const $ = id => document.getElementById(id);
  let busy = false;
  let current = 'en';

  function post(msg) { parent.postMessage(msg, '*'); }

  function renderLangs(langs) {
    const box = $('langs');
    box.innerHTML = '';
    for (const [code, label] of Object.entries(langs)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-pressed', String(code === current));
      b.disabled = busy;
      b.onclick = () => { if (!busy && code !== current) post({ type: 'set-lang', lang: code }); };
      box.appendChild(b);
    }
  }

  window.addEventListener('message', ev => {
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'theme') document.documentElement.dataset.theme = m.theme;
    if (m.type === 'state') {
      if (!m.file) { $('file').textContent = 'Open a file to switch its language.'; return; }
      current = m.stats.lang;
      $('file').textContent = m.file;
      renderLangs(m.langs);
      $('stats').hidden = false;
      $('translated').textContent = m.stats.translated;
      $('outdated').textContent = m.stats.outdated;
      $('missing').textContent = m.stats.missing;
    }
    if (m.type === 'busy') {
      busy = true;
      $('status').className = 'status';
      $('status').textContent = 'Switching…';
      document.querySelectorAll('#langs button').forEach(b => b.disabled = true);
    }
    if (m.type === 'progress' && busy) {
      const pct = m.total ? Math.round(100 * m.done / m.total) : 0;
      $('status').textContent = `Switching… ${pct}% (${m.done} / ${m.total} texts)`;
    }
    if (m.type === 'done') {
      busy = false;
      const r = m.result;
      $('status').textContent = `Done · ${r.changed} texts switched` + (r.kept ? ` · ${r.kept} kept as they are` : '');
    }
    if (m.type === 'error') {
      busy = false;
      $('status').className = 'status error';
      $('status').textContent = 'Error: ' + m.message;
    }
  });

  $('refresh').onclick = () => post({ type: 'refresh' });
  post({ type: 'ready' });
</script>
</body>
</html>
